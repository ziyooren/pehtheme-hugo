{{ define "main" }}

<div class="py-14">

	{{- with .Params.image | default .Params.cover.image }}
	<div class="mb-14">

		{{- $imgURL := partial "content/image-url.html" (dict "page" $ "path" .) }}

		<img class="rounded-3xl" src="{{ $imgURL }}" alt="{{ $.Title }}">

	</div>
	{{- end }}


	<div class="grid grid-cols-1 md:grid-cols-3 gap-6">

		<article class="md:col-span-2 prose lg:prose-lg">

		<header class="not-prose mb-14">

			<h1 class="text-4xl font-bold">{{ .Title }}</h1>
		
		</header>

		<div id="content" class="prose lg:prose-lg">

			{{- .Content -}}
			
		</div>

		</article>

		<aside class="md:col-span-1">

			{{- partial "content/aside.html" . -}}
		
		</aside>

	</div>

</div>

{{ end }}
