{{- /* Sidebar banner box. Configure via site config:
         [params.banner]
           image = "/images/banner.png"
           alt   = "Your ad banner" */ -}}
{{- with site.Params.banner }}
  {{- with .image }}
  <div class="rounded-2xl p-4 bg-zinc-100 mb-10">
    <img class="aspect-video rounded" src="{{ . }}" alt="{{ site.Params.banner.alt | default "Banner" }}">
    <p class="text-right text-xs mt-2 leading-none text-zinc-500">Advertisement</p>
  </div>
  {{- end }}
{{- end }}
