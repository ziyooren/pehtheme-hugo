<article class="relative group flex flex-row">
	<a class="insert-link" href="{{ .Permalink }}"></a>
	<figure class="basis-1/3 aspect-square overflow-hidden rounded-2xl bg-zinc-100">

		{{- with $postImage := .Params.image | default .Params.cover.image }}

		  {{- $imgURL := partial "content/image-url.html" (dict "page" $ "path" $postImage "process" "fill 250x250 center") }}

		  <img class="object-cover h-full w-full group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $imgURL }}" alt="{{ $.Name }}" style="width: 100%; height: 100%; object-fit: cover;">

		{{- end }}

	</figure>
	<div class="basis-2/3 self-center ml-4">
		<h3 class="font-bold group-hover:underline decoration-auto">{{ .LinkTitle }}</h3>
	</div>
</article>
