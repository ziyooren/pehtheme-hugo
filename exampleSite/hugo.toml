# -----------------------------------------------------------------------------
# Module / version requirements (keep as-is)
# -----------------------------------------------------------------------------
[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"
  [module.mounts] # Directing the static folder to assets.
  	source = 'assets'
  	target = 'static'
